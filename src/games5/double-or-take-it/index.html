<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Double or Take It</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="../index.html">← Games 5</a>
      <header class="top">
        <h1>Double or Take It</h1>
        <p class="tagline">Do you want it, or double it and give it to the next person?</p>
      </header>

      <p class="offer" id="offer"></p>
      <p class="odds" id="odds"></p>
      <canvas id="street" width="900" height="340" aria-label="You and a line of people waiting to be asked"></canvas>
      <p class="status" id="status" aria-live="polite"></p>

      <button class="ask" id="ask" type="button">ASK</button>
      <p class="keys">Click ASK, or press SPACE.</p>
      <p class="money" id="money"></p>
      <p class="best" id="best"></p>

      <section class="shop-panel" aria-labelledby="shop-heading">
        <h2 id="shop-heading">Shop</h2>
        <p class="shop-copy">Each thing is worth $1. The worse it is, the more people double it.</p>
        <ol class="shop" id="shop"></ol>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
