<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1418" />
    <title>The Game of Holden</title>
    <link rel="stylesheet" href="./select.css" />
  </head>
  <body>
    <div class="intro" id="intro" hidden>
      <canvas id="intro-canvas" width="720" height="360" aria-label="Opening scene"></canvas>
      <button class="intro-skip" id="intro-skip" type="button">Skip</button>
    </div>

    <main class="select">
      <a class="back-link" href="./index.html"><span aria-hidden="true">&larr;</span> Back</a>
      <header class="select-head">
        <p class="kicker">it knows you opened this</p>
        <h1 class="dread">The Game of Holden</h1>
        <p class="sub">Ten worlds, in order. Finish one to open the next.</p>
        <p class="purse">You have <strong id="purse-count">0</strong> coins.</p>
      </header>
      <a class="shop-link" href="./shop.html">The Skin Shop &rarr;</a>
      <button class="mood-toggle" id="mood-toggle" type="button" hidden>Switch to Scawwy Games</button>
      <button class="replay-intro" id="replay-intro" type="button">Watch the opening again</button>
      <ol class="worlds" id="worlds"></ol>
      <p class="note" id="note">Only the first world is built so far.</p>
    </main>
    <script type="module" src="./select.ts"></script>
  </body>
</html>
