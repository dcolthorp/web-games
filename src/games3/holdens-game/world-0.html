<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1418" />
    <title>Holden's Game</title>
    <link rel="stylesheet" href="./game.css" />
    <link rel="stylesheet" href="./select.css" />
  </head>
  <body>
    <div class="intro" id="intro" hidden>
      <canvas id="intro-canvas" width="720" height="360" aria-label="Going down"></canvas>
      <button class="intro-skip" id="intro-skip" type="button">Skip</button>
    </div>

    <main class="adventure">
      <header class="hud">
        <a class="back-link" href="./game.html"><span aria-hidden="true">&larr;</span> Worlds</a>
        <p class="world-name" id="world-name">&hellip;</p>
        <button class="story-button" id="story-button" type="button" hidden>Story</button>
        <div class="keys" id="keys" aria-label="Keys, coins and shell">
          <button class="music-button" id="music-button" type="button" hidden>Music on</button>
          <span class="key-slots" id="key-slots"></span>
          <span class="coins" id="coin-count" aria-label="Coins collected here">0</span>
          <span class="shield-pip" id="shield-pip" aria-label="Shell" hidden></span>
        </div>
      </header>

      <div class="stage">
        <canvas id="world" width="720" height="480" aria-label="The adventure world"></canvas>
        <div class="banner" id="banner" hidden>
          <p class="banner-title" id="banner-title"></p>
          <p class="banner-text" id="banner-text"></p>
          <div class="banner-buttons">
            <a class="banner-button" id="banner-next" href="./game.html">Back to the worlds</a>
            <button class="banner-button is-quiet" id="banner-button" type="button">Play again</button>
          </div>
        </div>
      </div>

      <p class="message" id="message">Arrow keys or WASD to move.</p>

      <div class="dpad" aria-label="Touch controls">
        <button type="button" data-move="up" aria-label="Up">&#9650;</button>
        <div class="dpad-row">
          <button type="button" data-move="left" aria-label="Left">&#9664;</button>
          <button type="button" data-move="down" aria-label="Down">&#9660;</button>
          <button type="button" data-move="right" aria-label="Right">&#9654;</button>
        </div>
      </div>
      <div class="story-panel" id="story-panel" hidden>
        <div class="story-sheet">
          <p class="story-head">The pages</p>
          <div id="story-list"></div>
          <div class="story-actions">
            <button class="banner-button" id="conclude-button" type="button" hidden>Conclude game</button>
            <button class="banner-button is-quiet" id="story-close" type="button">Close</button>
          </div>
        </div>
      </div>

      <div class="console" aria-label="Console">
        <div class="console-log" id="console-log"></div>
        <form class="console-form" id="console-form" autocomplete="off">
          <span class="console-caret" aria-hidden="true">&gt;</span>
          <input class="console-input" id="console-input" type="text" spellcheck="false" aria-label="Type a command" />
        </form>
      </div>
    </main>
    <script type="module" src="./world0.ts"></script>
  </body>
</html>
