<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clair's Game</title>
    <link rel="stylesheet" href="../../styles/main.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="games3-hub">
    <main class="menu-shell">
      <a class="clairs-back" href="../index.html">← Games 3</a>
      <section class="clairs-panel">
        <p class="clairs-eyebrow">A present for Clair</p>
        <h1 class="clairs-title">Farttopia</h1>
        <p class="clairs-note">
          You cannot walk. Hold <kbd>Space</kbd> to squeeze one out — the longer you hold, the farther you
          go. Aim with <kbd>←</kbd> <kbd>→</kbd>. Drift off one edge, come back on the other.
        </p>
      </section>
      <div class="fart-stage">
        <canvas id="farttopia" width="960" height="560" aria-label="Farttopia: fart around to move"></canvas>
        <div class="fart-hud">
          <span id="charge-label">CHARGE</span>
          <div class="charge-track"><div class="charge-fill" id="charge-fill"></div></div>
          <span id="fart-count">FARTS 0</span>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
