<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Eggs</title>
    <meta name="credits-made-by" content="Penelope" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="../../penelope/index.html">← Penelope's Games</a>
      <header class="hero">
        <p class="eyebrow">Penelope's pet house</p>
        <h1>Pet Eggs</h1>
      </header>

      <section class="home" aria-label="Your pet's room">
        <div class="top-bar">
          <p class="bucks"><span id="bucks">0</span> bucks 💰</p>
          <div class="swap">
            <button id="prev-pet" class="pill swap-arrow" type="button" aria-label="Take care of the pet before" hidden>◀</button>
            <p id="pet-name" class="pet-name"></p>
            <button id="next-pet" class="pill swap-arrow" type="button" aria-label="Take care of the next pet" hidden>▶</button>
          </div>
          <button id="eggs" class="pill pill-main" type="button">🥚 Egg Shop</button>
        </div>
        <canvas id="room" width="800" height="460" aria-label="Your pet's room"></canvas>
        <p id="message" class="message" aria-live="polite"></p>
        <div id="care" class="care" aria-label="Take care of your pet"></div>
        <h2 class="pets-title">🎒 My stuff <small id="stuff-hint"></small></h2>
        <div id="stuff" class="stuff"></div>
        <h2 class="pets-title">My pets <small id="pets-hint"></small></h2>
        <div id="pets" class="pets"></div>
      </section>
    </main>

    <section id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-note" class="overlay-note" aria-live="polite"></p>
        <div id="overlay-body"></div>
        <div id="overlay-buttons" class="overlay-buttons"></div>
      </div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
