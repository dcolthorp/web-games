<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Sandbox</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="../index.html">← Games 4</a>
      <header class="hero">
        <p class="eyebrow">Sandbox · The possibilities are endless</p>
        <h1>World Sandbox</h1>
      </header>

      <section class="game-frame" aria-label="Your world">
        <canvas id="world" width="960" height="600" aria-label="A map of your world seen from space, with ocean and land"></canvas>
      </section>

      <section class="toolbar" aria-label="Things to add">
        <div class="toolbar-slots" id="toolbar-slots"></div>
        <button class="new-world" id="new-world" type="button">New World</button>
      </section>

      <p class="instructions" id="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
