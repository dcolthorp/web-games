<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="../index.html">← Games 4</a>
      <header class="hero">
        <p class="eyebrow">Sandbox · The possibilities are endless</p>
        <h1>World Sandbox</h1>
      </header>

      <div class="play">
        <div class="map">
          <section class="game-frame" aria-label="Your world">
            <canvas id="world" width="320" height="200" aria-label="A pixel map of your world seen from space, with ocean and land"></canvas>
          </section>
          <p class="instructions" id="status" aria-live="polite"></p>
        </div>

        <section class="toolbar" aria-label="Things to add">
          <div class="tool-group" id="categories" role="group" aria-label="What kind of thing"></div>
          <div class="tool-group choices" id="choices" role="group" aria-label="Which one"></div>
          <button class="new-world" id="new-world" type="button">New World</button>
        </section>
      </div>
    </main>

    <dialog class="panel" id="person-dialog" aria-labelledby="person-title">
      <form method="dialog" id="person-form">
        <h2 id="person-title">Person</h2>
        <label class="field">Name <input id="person-name" maxlength="16" required autocomplete="off" /></label>
        <label class="field">Tribe <select id="person-tribe"></select></label>
        <fieldset>
          <legend>Traits</legend>
          <div id="person-traits"></div>
        </fieldset>
        <div class="panel-buttons">
          <button class="quiet" type="button" id="person-remove">Remove</button>
          <button type="submit">Done</button>
        </div>
      </form>
    </dialog>

    <dialog class="panel" id="tribe-dialog" aria-labelledby="tribe-title">
      <form method="dialog" id="tribe-form">
        <h2 id="tribe-title">New Tribe</h2>
        <label class="field">Name <input id="tribe-name" maxlength="20" required autocomplete="off" /></label>
        <fieldset>
          <legend>Colour</legend>
          <div class="swatches" id="tribe-colors"></div>
        </fieldset>
        <fieldset id="tribe-wars-field">
          <legend>At war with</legend>
          <div id="tribe-wars"></div>
        </fieldset>
        <div class="panel-buttons">
          <button class="quiet" type="button" id="tribe-cancel">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
