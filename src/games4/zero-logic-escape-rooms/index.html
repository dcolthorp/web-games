<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zero Logic Escape Rooms</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="../index.html">← Games 4</a>
      <header class="hero">
        <p class="eyebrow" id="room-name">Escape Room 1 · The Room With Nothing</p>
        <h1>Zero Logic Escape Rooms</h1>
      </header>

      <section class="game-frame" aria-label="Escape room">
        <canvas id="game" width="960" height="600" aria-label="A room with no door, no window, no nothing"></canvas>
        <div class="escape-overlay" id="escape-overlay" hidden>
          <p class="escape-title">YOU ESCAPED</p>
          <p class="escape-note">You fell down the table hole and landed in…</p>
          <p class="escape-next">ESCAPE ROOM 2</p>
          <p class="escape-soon">Coming soon.</p>
          <button type="button" data-action="restart">Play Room 1 Again</button>
        </div>
      </section>

      <p class="instructions">There is no door. There is no window. There is no logic. Click things.</p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
