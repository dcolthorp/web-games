<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zero Logic Escape Rooms</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <a class="back-link" href="../index.html">← Games 4</a>
      <header class="hero">
        <p class="eyebrow" id="room-name">Escape Room 1 · The Room With Nothing</p>
        <h1>Zero Logic Escape Rooms</h1>
      </header>

      <section class="game-frame" aria-label="Escape room">
        <canvas id="game" width="960" height="600" aria-label="An escape room with no door and no window"></canvas>
        <div class="escape-overlay" id="escape-overlay" hidden>
          <p class="escape-title">YOU ESCAPED</p>
          <p class="escape-note" id="escape-note"></p>
          <p class="escape-next" id="escape-next"></p>
          <p class="escape-soon">Coming soon.</p>
          <button type="button" data-action="restart">Start Over From Room 1</button>
        </div>
      </section>

      <section class="toolbar" id="toolbar" aria-label="Tool bar" hidden>
        <p class="toolbar-label">Tool Bar</p>
        <div class="toolbar-slots" id="toolbar-slots"></div>
      </section>

      <nav class="room-picker" id="room-picker" aria-label="Rooms you have reached" hidden></nav>

      <p class="instructions">There is no door. There is no window. There is no logic. Click things.</p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
