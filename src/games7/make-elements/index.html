<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Make Elements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <a class="back-link" href="../index.html">← Games 7</a>
      <h1>Make Elements</h1>
      <span class="money" id="money">$0</span>
      <button class="pedia-button" id="pedia-button" type="button">📖 Elemepiedia <span id="found-count"></span></button>
    </header>

    <div class="world-wrap">
      <canvas id="world"></canvas>
      <div class="hover-info" id="hover-info" hidden></div>
      <div class="toasts" id="toasts"></div>
    </div>

    <div class="picker" id="picker" hidden></div>
    <nav class="tools" id="tools"></nav>

    <div class="pedia" id="pedia" hidden>
      <div class="pedia-panel" role="dialog" aria-labelledby="pedia-title">
        <div class="pedia-head">
          <h2 id="pedia-title">📖 Elemepiedia</h2>
          <button class="pedia-close" id="pedia-close" type="button" aria-label="Close">✕</button>
        </div>
        <p class="pedia-count" id="pedia-count"></p>
        <div class="pedia-trophies" id="pedia-trophies"></div>
        <div class="pedia-list" id="pedia-list"></div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
