<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penelope's Games</title>
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body class="penelope-hub" data-akl-path="../games/a-kids-life/index.html" data-cat-math-path="../games/cat-math/index.html" data-sharks-path="../games3/sharks-in-the-water/index.html">
    <main class="menu-shell penelope-shell">
      <section class="hero-panel penelope-hero">
        <div class="penelope-copy">
          <p class="eyebrow">Penelope's cozy game shelf</p>
          <div class="title-row">
            <h1>Penelope's Games</h1>
            <a class="owner-switch owner-switch-oscar" href="../index.html">Oscar's Games</a>
            <a class="owner-switch owner-switch-games3" href="../games3/index.html">Games 3</a>
          </div>
          <p class="subtitle">
            Sweet little worlds, purple sparkles, and one very polite tiny cat.
          </p>
        </div>

        <div class="kitty-stage" role="img" aria-label="A small animated black short-hair kitty">
          <div class="sparkle sparkle-one" aria-hidden="true"></div>
          <div class="sparkle sparkle-two" aria-hidden="true"></div>
          <div class="sparkle sparkle-three" aria-hidden="true"></div>
          <div class="kitty">
            <div class="kitty-tail" aria-hidden="true"></div>
            <div class="kitty-body" aria-hidden="true"></div>
            <div class="kitty-head" aria-hidden="true">
              <div class="kitty-ear kitty-ear-left"></div>
              <div class="kitty-ear kitty-ear-right"></div>
              <div class="kitty-eye kitty-eye-left"></div>
              <div class="kitty-eye kitty-eye-right"></div>
              <div class="kitty-nose"></div>
              <div class="kitty-whisker kitty-whisker-left kitty-whisker-top"></div>
              <div class="kitty-whisker kitty-whisker-left kitty-whisker-bottom"></div>
              <div class="kitty-whisker kitty-whisker-right kitty-whisker-top"></div>
              <div class="kitty-whisker kitty-whisker-right kitty-whisker-bottom"></div>
            </div>
            <div class="kitty-paw kitty-paw-left" aria-hidden="true"></div>
            <div class="kitty-paw kitty-paw-right" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <section class="menu-container penelope-menu" aria-labelledby="penelope-game-list-heading">
        <div class="section-header">
          <h2 id="penelope-game-list-heading">Pick a Cozy Adventure</h2>
          <p class="section-copy">A soft landing page for Penelope's games.</p>
        </div>
        <ul class="game-list" id="game-list">
          <!-- Games will be added here -->
        </ul>
      </section>
    </main>
    <script type="module" src="../games/penelope/main.ts"></script>
  </body>
</html>
